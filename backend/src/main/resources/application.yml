spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/boltseged}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:boltseged}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:change-me}}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: true
server:
  error.include-message: never
  tomcat.max-http-form-post-size: 30MB
app:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-this-32-chars}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin.email: ${ADMIN_EMAIL:}
  admin.password: ${ADMIN_PASSWORD:}
  labels.path: ${LABEL_STORAGE_PATH:./data/labels}
dhl:
  # Leave blank to select DHL's official URL from DHL_TEST_MODE.
  api-base-url: ${DHL_API_BASE_URL:}
  username: ${DHL_API_USERNAME:}
  password: ${DHL_API_PASSWORD:}
  account-number: ${DHL_ACCOUNT_NUMBER:}
  test-mode: ${DHL_TEST_MODE:true}
