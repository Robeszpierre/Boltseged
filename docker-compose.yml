services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-boltseged}
      POSTGRES_USER: ${POSTGRES_USER:-boltseged}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boltseged} -d ${POSTGRES_DB:-boltseged}"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-boltseged}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-boltseged}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-this-local-secret-32-characters}
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
      DHL_API_BASE_URL: ${DHL_API_BASE_URL:-}
      DHL_API_USERNAME: ${DHL_API_USERNAME:-}
      DHL_API_PASSWORD: ${DHL_API_PASSWORD:-}
      DHL_ACCOUNT_NUMBER: ${DHL_ACCOUNT_NUMBER:-}
      DHL_TEST_MODE: ${DHL_TEST_MODE:-true}
      LABEL_STORAGE_PATH: ${LABEL_STORAGE_PATH:-/app/data/labels}
    ports: ["8080:8080"]
    volumes: ["label-data:/app/data/labels"]
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
  frontend:
    build: { context: ., dockerfile: infra/Dockerfile.frontend }
    restart: unless-stopped
  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend, frontend]
    restart: unless-stopped
volumes:
  postgres-data:
  label-data:
  caddy-data:
  caddy-config:
